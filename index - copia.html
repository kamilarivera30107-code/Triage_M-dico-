<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Triage Médico Rápido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">
    <div class="container text-center">
        <h2 class="border-bottom pb-2 mb-4">🏥 Panel de Triage - Urgencias</h2>
        
        <!-- Fila principal que contiene ambos elementos lado a lado -->
        <div class="row mt-4 align-items-start">
            
            <!-- Columna izquierda: Formulario de Nuevo Ingreso -->
            <div class="col-4">
                <div class="card shadow-sm p-3 card-personalizada">
                    <h4 class="mb-3">Nuevo Ingreso</h4>
                    <input type="text" id="nombreP" class="form-control mb-2 text-center" placeholder="Nombre del paciente">
                    <input type="number" id="oxigenoP" class="form-control mb-2 text-center" placeholder="Saturación O2 (%)">
                    <input type="number" id="ritmoP" class="form-control mb-3 text-center" placeholder="Frecuencia Cardíaca (lpm)">
                    <button id="btnRegistrar" class="btn w-100 btn-personalizado">Registrar Signos</button>
                </div>
            </div>

            <!-- Columna derecha: Tabla de registros -->
            <div class="col-8">
                <table class="table table-hover shadow-sm align-middle bg-white">
                    <thead>
                        <tr class="table-secondary">
                            <th>Paciente</th>
                            <th>O2 (%)</th>
                            <th>Frecuencia Cardíaca</th>
                            <th>Prioridad (Triage)</th>
                        </tr>
                    </thead>
                    <tbody id="listaPacientes">
                        <!-- Aquí se imprimen los datos -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
